name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jules-web.pages.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Wrangler 4 requires Node.js 22.12 or newer.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure Pages project exists
        # Create the project on the first run. If it already exists, the API
        # answers 8000002 ("already exists"), which is the steady state.
        run: |
          set +e
          output=$(npx wrangler pages project create jules-web --production-branch main 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$output" | grep -Eqi 'already exists|8000002'; then
              echo "Pages project jules-web already exists."
            else
              printf '%s\n' "$output"
              exit "$status"
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        # On main this targets the project's production branch. On a pull request
        # it creates a preview deployment named after the PR source branch.
        run: >-
          npx wrangler pages deploy dist
          --project-name jules-web
          --branch ${{ github.head_ref || github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}